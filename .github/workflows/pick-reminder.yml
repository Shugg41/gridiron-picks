# Saturday-morning nag: if any pool games are unpicked, or picks aren't
# marked as entered in Splash, send a push via ntfy before the noon lock.
# Sends nothing when everything is done.
name: Pick reminder

on:
  schedule:
    - cron: "0 13 * * 6"   # Saturday 9:00 AM ET (EDT); 8:00 AM once EST starts
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send reminder if picks are missing
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/notify.py remind
