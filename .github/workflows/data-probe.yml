# Manual-only diagnostics: what can reach ESPN from where, and is the live
# app healthy. The dev sandbox has no egress to ESPN and CI gets 403s from
# plain HTTP clients, so this establishes the real constraints before any
# parser is written against them.
name: ESPN data probe

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "all probes, or just the line backfill"
        type: choice
        options: [all, lines, deepdive, opinions, coverage, lookahead]
        default: all
      days:
        description: "lookahead only: space-separated YYYYMMDD, blank for the next Thu-Mon"
        type: string
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # stdlib only: the point is to learn what a plain client is served
      - run: python scripts/probe_espn.py
        if: inputs.scope == 'all'
      # Separate question, same "probe before you build" rule: can the
      # scoreboard be asked for a date range, and does site.api answer a
      # runner at all once it stops announcing itself as a script.
      - run: python scripts/probe_dates.py
        if: always() && inputs.scope == 'all'
      # Is the movement the app reports as advice actually real?
      - run: python scripts/probe_movement.py
        if: always() && inputs.scope == 'all'
      # Is FPI worth wiring in, or does it just agree with the line?
      - run: python scripts/probe_fpi.py
        if: always() && inputs.scope == 'all'
      # Every FPI call 404s or similar; find the path that answers.
      - run: python scripts/probe_paths.py
        if: always() && inputs.scope == 'all'
      # Pair each past game's crowd share with the price the pool was
      # offered. TSV to stdout, read back out of the log.
      - run: python scripts/backfill_lines.py
        if: always() && (inputs.scope == 'all' || inputs.scope == 'lines')
      # A whole-week read: every game's price against what this pool
      # will do with it, and the week simulated against 37 rivals whose
      # chalkiness is measured from their own five weeks of cards.
      - run: python scripts/deep_dive.py
        if: always() && inputs.scope == 'deepdive'
      # Market and FPI for this week's board, recorded before kickoff.
      # Splash's own number comes from Splash's own line, so it is not a
      # second opinion; these two are. Written down weekly so that which
      # signal is actually right becomes a measurement rather than an
      # argument.
      - run: python scripts/second_opinion.py
        if: always() && inputs.scope == 'opinions'
      # Why the college slate comes back short, asked rather than guessed.
      - run: python scripts/probe_coverage.py
        if: always() && inputs.scope == 'coverage'
      # Rate the coming weekend before Splash posts a board. The board
      # decides which thirty games are on the card, not which are
      # played, so the card can be priced days before it exists.
      - run: python scripts/lookahead.py ${{ inputs.days }}
        if: always() && inputs.scope == 'lookahead'
