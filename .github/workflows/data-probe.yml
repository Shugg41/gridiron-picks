# Manual-only diagnostics: what can reach ESPN from where, and is the live
# app healthy. The dev sandbox has no egress to ESPN and CI gets 403s from
# plain HTTP clients, so this establishes the real constraints before any
# parser is written against them.
name: ESPN data probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe_espn.py
