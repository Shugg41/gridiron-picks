# Manual-only diagnostics: what can reach ESPN from where, and is the live
# app healthy. The dev sandbox has no egress to ESPN and CI gets 403s from
# plain HTTP clients, so this establishes the real constraints before any
# parser is written against them.
name: ESPN data probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      # stdlib only: the point is to learn what a plain client is served
      - run: python scripts/probe_espn.py
      # Separate question, same "probe before you build" rule: can the
      # scoreboard be asked for a date range, and does site.api answer a
      # runner at all once it stops announcing itself as a script.
      - run: python scripts/probe_dates.py
        if: always()
