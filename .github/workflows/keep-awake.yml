# Visits the Streamlit app every 2 hours with a real headless browser so
# Community Cloud never puts it to sleep (apps sleep after ~12h without
# viewer traffic, and cold wakes take 1-2 minutes).
#
# A real browser is required: plain curl gets stuck in Streamlit Cloud's
# redirect loop and doesn't register as viewer traffic (no websocket).
# The browser session also clicks the "get this app back up" button if the
# app somehow fell asleep anyway — so this both prevents AND undoes sleep.
#
# Note: GitHub disables scheduled workflows after 60 days of no repo
# activity. This app commits the picks DB to the repo on every save, so
# the schedule stays alive naturally during the season.
name: Keep app awake

on:
  schedule:
    - cron: "23 */2 * * 2,3"   # every 2h Tue/Wed: just keep it awake
    - cron: "23 * * * 4,5,6,0,1"  # hourly Thu-Mon: games are being played,
                                  # and this load is what grades them and
                                  # pushes the running score
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The assertions below read the committed database to work out what
      # the page ought to be showing. Without the repo on disk, sqlite3
      # silently creates an empty file, the first query raises "no such
      # table: game", expectations() returns nothing, and the check passes
      # by having nothing to check — which is what it had been doing since
      # the day it was added.
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Visit app in a real browser
        run: |
          cat > visit.py <<'EOF'
          import re, sys, time
          from playwright.sync_api import sync_playwright

          URL = "https://shuggs-picks.streamlit.app/"

          def dump(page, label):
              print(f"--- {label} ---")
              print("url:  ", page.url)
              print("title:", page.title())
              # Read every frame, not just the top one. The app's content
              # lives in a child frame, so the top body is always empty —
              # which made every dump so far useless at the moment it was
              # most needed.
              for f in page.frames:
                  print("frame:", f.url[:120])
                  try:
                      body = re.sub(r"\s+", " ",
                                    f.locator("body").inner_text())[:4000]
                      if body.strip():
                          print("  body:", body)
                  except Exception as e:
                      print("  body read failed:", type(e).__name__)

          # A crashed Streamlit app still renders stAppViewContainer, so
          # "it rendered" is not "it works" — this ping went green while
          # the app was dead on an AttributeError. Look for the crash
          # page itself. st.error and st.warning are stAlert, not
          # stException, so the app's own messages do not trip this.
          def broken(page):
              for frame in page.frames:
                  try:
                      exc = frame.locator('[data-testid="stException"]')
                      if exc.count():
                          dump(page, "app is showing an exception")
                          print("exception text:",
                                re.sub(r"\s+", " ", exc.first.inner_text())[:800])
                          return True
                      hit = frame.get_by_text(
                          re.compile("this app has encountered an error", re.I))
                      if hit.count():
                          dump(page, "app is showing the crash page")
                          return True
                  except Exception:
                      pass
              return False


          # What the database says MUST therefore be on the page.
          # "It did not crash" is too weak a test: FPI spent a
          # fortnight returning 404, the late-change watch sat idle,
          # and the recap could not fire — all behind a green ping.
          # Each of those was a feature quietly producing nothing, and
          # nothing is exactly what this used to accept.
          def expectations():
              import sqlite3
              want = []
              try:
                  db = sqlite3.connect("football_picks.db")
                  season, week = 2026, db.execute(
                      "SELECT MAX(week) FROM game WHERE season=2026"
                  ).fetchone()[0]
                  games = db.execute(
                      "SELECT COUNT(*) FROM game WHERE season=? AND week=?",
                      (season, week)).fetchone()[0]
                  if games:
                      want.append((f"{games} games", "the week's game count"))
                  if db.execute("SELECT COUNT(*) FROM standing").fetchone()[0]:
                      want.append(("points a week", "the strategy line"))
                  graded = db.execute(
                      "SELECT COUNT(*) FROM entry WHERE result IS NOT NULL"
                  ).fetchone()[0]
                  if graded:
                      want.append(("Season ", "the season record"))
                  db.close()
              except Exception as e:
                  # Returning [] here means "assert nothing", so this is
                  # a failure of the check itself, not a clean skip.
                  print("could not read expectations:", type(e).__name__, e)
                  sys.exit(1)
              return want


          def missing(page, want):
              out = []
              for needle, what in want:
                  seen = False
                  for f in page.frames:
                      try:
                          if needle in f.locator("body").inner_text():
                              seen = True
                              break
                      except Exception:
                          pass
                  if not seen:
                      out.append(f"{what} (looked for {needle!r})")
              return out


          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="domcontentloaded", timeout=60_000)
              page.wait_for_timeout(8_000)
              dump(page, "after load")

              # If the app fell asleep, click the wake-up button (search every
              # frame — the platform shell sometimes wraps content). Match the
              # button's full text only: a bare "wake" also matches team names
              # like Wake Forest in the app's own content. Never let a false
              # positive fail the run — rendering is what actually matters.
              for frame in page.frames:
                  wake = frame.get_by_text(re.compile("get this app back up", re.I))
                  if wake.count():
                      print("App may be asleep — clicking wake-up button...")
                      try:
                          wake.first.click(timeout=5_000)
                      except Exception as e:
                          print("wake click skipped:", type(e).__name__)
                      break

              # Wait for the app to render; the open websocket session is
              # what counts as real viewer traffic. Accept either the app's
              # own text or Streamlit's root container, in any frame.
              deadline = time.time() + 240
              while time.time() < deadline:
                  for frame in page.frames:
                      try:
                          if (frame.get_by_text("Gridiron").count()
                                  or frame.locator('[data-testid="stAppViewContainer"]').count()):
                              print("App is up and rendering.")
                              page.wait_for_timeout(15_000)  # hold the session open
                              if broken(page):
                                  browser.close()
                                  sys.exit(1)
                              gone = missing(page, expectations())
                              if gone:
                                  dump(page, "page is missing what it should show")
                                  for g in gone:
                                      print("MISSING:", g)
                                  browser.close()
                                  sys.exit(1)
                              browser.close()
                              sys.exit(0)
                      except Exception:
                          pass
                  page.wait_for_timeout(5_000)

              dump(page, "after timeout")
              print("ERROR: app did not render within 4 minutes.")
              sys.exit(1)
          EOF
          python visit.py
